name: admob_flutter_plus
description: >-
  Community Flutter plugin for Google Mobile Ads Next-Gen SDK (Android):
  banners, interstitials, rewarded, native templates, preloaders, UMP, app open.
version: 0.1.3
homepage: https://github.com/Detekfit/admob_flutter_plus
repository: https://github.com/Detekfit/admob_flutter_plus
issue_tracker: https://github.com/Detekfit/admob_flutter_plus/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - ads
  - admob
  - google-mobile-ads
  - android

platforms:
  android:

screenshots:
  - description: "admob_flutter_plus demo — AdMob formats in one Flutter plugin."
    path: screenshots/admob_flutter_plus.webp

flutter:
  plugin:
    platforms:
      android:
        package: io.admobflutterplus.admob_flutter_plus
        pluginClass: AdmobFlutterPlusPlugin
