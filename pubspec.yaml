name: admob_flutter_plus
description: >-
  A community-maintained Flutter plugin for the Google Mobile Ads Next-Gen SDK
  on Android — banners, interstitials, rewarded ads, native templates,
  preloaders, UMP consent, and app open ads.
version: 0.1.0
homepage: https://github.com/YOUR_ORG/admob_flutter_plus
repository: https://github.com/YOUR_ORG/admob_flutter_plus
issue_tracker: https://github.com/YOUR_ORG/admob_flutter_plus/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - ads
  - admob
  - google-mobile-ads
  - android

platforms:
  android:

# Add screenshots before publishing to pub.dev, e.g.:
# screenshots:
#   - description: "Banner and native ad templates."
#     path: screenshots/banner.webp

flutter:
  plugin:
    platforms:
      android:
        package: io.admobflutterplus.admob_flutter_plus
        pluginClass: AdmobFlutterPlusPlugin
